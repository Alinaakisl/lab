<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue • Цветные прямоугольники</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .app-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 900px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .color-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .color-box {
            width: 150px;
            height: 150px;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .color-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .color-box:active {
            transform: scale(0.98);
        }

        .reset-btn {
            display: block;
            margin: 0 auto;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background: #764ba2;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }

        .reset-btn:hover {
            background: #5a3a7a;
        }

        .reset-btn:active {
            transform: scale(0.98);
        }

        .info {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 12px;
        }
    </style>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app">
        <div class="app-container">
            <h1> Цветные прямоугольники</h1>
            <div class="subtitle">Кликни на любой блок — цвет изменится на случайный!</div>
            
            <div class="color-grid">
                <div v-for="(colorItem, index) in colors" 
                     :key="colorItem.id"
                     class="color-box"
                     :style="{ backgroundColor: colorItem.currentColor }"
                     @click="changeColor(index)">
                    {{ colorItem.name }}
                </div>
            </div>
            
            
            <div class="info">✨ Исходные цвета: красный, зелёный, синий, жёлтый, фиолетовый</div>
        </div>
    </div>

    <script>
        const { createApp, ref } = Vue;

        createApp({
            setup() {
                // Инициализируем массив из 5 объектов с названиями цветов
                // У всех пяти есть название, которое отображается на прямоугольнике
                const colors = ref([
                    { id: 1, name: 'red', currentColor: '#e74c3c' },
                    { id: 2, name: 'green', currentColor: '#2ecc71' },
                    { id: 3, name: 'blue', currentColor: '#3498db' },
                    { id: 4, name: 'yellow', currentColor: '#f1c40f' },
                    { id: 5, name: 'purple', currentColor: '#9b59b6' }
                ]);

                // Функция для генерации случайного цвета
                const getRandomColor = () => {
                    const letters = '0123456789ABCDEF';
                    let color = '#';
                    for (let i = 0; i < 6; i++) {
                        color += letters[Math.floor(Math.random() * 16)];
                    }
                    return color;
                };

                // Функция изменения цвета при клике
                const changeColor = (index) => {
                    colors.value[index].currentColor = getRandomColor();
                };

                // Функция сброса всех цветов к исходным
                const resetColors = () => {
                    colors.value = [
                        { id: 1, name: 'red', currentColor: '#e74c3c' },
                        { id: 2, name: 'green', currentColor: '#2ecc71' },
                        { id: 3, name: 'blue', currentColor: '#3498db' },
                        { id: 4, name: 'yellow', currentColor: '#f1c40f' },
                        { id: 5, name: 'purple', currentColor: '#9b59b6' }
                    ];
                };

                return {
                    colors,
                    changeColor,
                    resetColors
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
