<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 🔮 JUWELIER | Ювелирный магазин</title>
    
    <style>
        /* ---------- СТИЛИ (полностью сохранены, кроме изменений в шапке) ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #fafafa;
            color: #ffffff;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background-color: white;
        }

        /* Header — изменён фон на бордовый, навигация скрыта, логотип по центру */
        header {
            background-color: #800020;  /* Бордовый цвет */
            padding: 20px 40px;
            display: flex;
            justify-content: center;    /* Центрируем содержимое */
            align-items: center;
            border-bottom: 1px solid #550404;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        /* Блок логотипа — полностью по центру */
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo img {
            width: 40px;
            height: 40px;
            filter: brightness(0) invert(1); /* чтобы лого (если появится) было светлым */
        }

        .logo h1 {
            font-size: 28px;
            font-weight: 400;
            letter-spacing: 3px;
            color: white;          /* белый текст на бордовом */
            margin: 0;
        }

        /* навигацию полностью скрываем */
        nav {
            display: none;
        }

        /* корзина остаётся справа, но позиционируем абсолютно, чтобы не ломать центрирование */
        .cart-icon {
            position: absolute;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 24px;
            color: white;          /* белая иконка корзины */
        }

        .cart-icon span {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #C9C59A;
            color: #2c2c2c;
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 50%;
        }

        /* Filters (без изменений) */
        .filters {
            padding: 30px 40px;
            border-bottom: 1px solid #980606;
        }

        .filter-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .filter-section {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .filter-label {
            color: #580000;
            cursor: pointer;
            transition: color 0.3s;
            font-size: 14px;
            padding: 5px 10px;
        }

        .filter-label:hover,
        .filter-label.active {
            color: #C9C59A;
            border-bottom: 2px solid #C9C59A;
        }

        .sort-select {
            padding: 8px 15px;
            border: 1px solid #ffffff;
            border-radius: 5px;
            background: rgb(94, 2, 2);
            cursor: pointer;
            font-size: 14px;
        }

        /* Products Grid */
        main {
            padding: 0 40px;
            position: relative;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            padding: 40px 0;
        }

        /* Карточка товара */
        .product-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .product-image {
            width: 100%;
            aspect-ratio: 1;
            background: linear-gradient(135deg, #C9C59A, #A69C59);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 15px;
        }

        .product-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #2c2c2c;
        }

        .product-price {
            font-size: 18px;
            font-weight: 600;
            color: #C9C59A;
            margin-bottom: 12px;
        }

        .product-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out;
            background: #f9f9f9;
            padding: 0 15px;
        }

        .product-card.expanded .product-details {
            max-height: 200px;
            padding: 15px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 13px;
            border-bottom: 1px solid #eee;
        }

        .detail-label {
            color: #666;
            font-weight: 500;
        }

        .detail-value {
            color: #2c2c2c;
        }

        .metal-gold {
            color: #DAA520;
            font-weight: bold;
        }

        .metal-silver {
            color: #C0C0C0;
            font-weight: bold;
        }

        .metal-platinum {
            color: #E5E4E2;
            font-weight: bold;
        }

        .add-to-cart {
            width: 100%;
            background: transparent;
            border: 1px solid #C9C59A;
            color: #C9C59A;
            padding: 10px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            margin-top: 10px;
        }

        .add-to-cart:hover {
            background: #C9C59A;
            color: white;
        }

        /* Cart Sidebar */
        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            height: 100vh;
            background: white;
            box-shadow: -2px 0 10px rgba(0,0,0,0.1);
            z-index: 1000;
            transition: right 0.3s;
            display: flex;
            flex-direction: column;
        }

        .cart-sidebar.open {
            right: 0;
        }

        .cart-header {
            padding: 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-cart {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }

        #cart-list {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .empty-cart {
            text-align: center;
            color: #999;
            padding: 40px 0;
        }

        .cart-item {
            display: flex;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-item-details {
            flex: 1;
        }

        .cart-item-title {
            font-size: 14px;
            font-weight: 500;
        }

        .cart-item-price {
            font-size: 14px;
            color: #C9C59A;
        }

        .cart-item-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 8px;
        }

        .quantity-btn {
            background: #f0f0f0;
            border: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #e74c3c;
            cursor: pointer;
        }

        .cart-total {
            padding: 20px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }

        .cart-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: none;
        }

        .cart-overlay.show {
            display: block;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #999;
            font-size: 12px;
            border-top: 1px solid #eee;
        }

        @media (max-width: 1200px) {
            .products-grid { grid-template-columns: repeat(3, 1fr); }
        }

        @media (max-width: 768px) {
            .products-grid { grid-template-columns: repeat(2, 1fr); }
            .cart-sidebar { width: 100%; right: -100%; }
            .filter-group { flex-direction: column; align-items: flex-start; }
            .cart-icon { right: 20px; }
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="container">
    <header>
        <div class="logo">
            <!-- Логотип (скрыт если нет картинки) -->
            <img src="images/logo.png" alt=" JUWELIER" onerror="this.style.display='none'">
            <h1>🔮 JUWELIER</h1>
        </div>
        <!-- Навигация удалена полностью -->
        <div class="cart-icon">
            <i class="fas fa-shopping-bag"></i>
            <span id="cart-count">0</span>
        </div>
    </header>

    <main>
        <!-- Фильтры и сортировка -->
        <div class="filters">
            <div class="filter-group">
                <div class="filter-section">
                    <span class="filter-label active" data-filter="all">Все</span>
                    <span class="filter-label" data-filter="ring">Кольца</span>
                    <span class="filter-label" data-filter="earrings">Серьги</span>
                    <span class="filter-label" data-filter="pendant">Подвески</span>
                    <span class="filter-label" data-filter="bracelet">Браслеты</span>
                </div>
                <div class="filter-section">
                    <span class="filter-label" data-metal="all">Все металлы</span>
                    <span class="filter-label" data-metal="gold">Золото</span>
                    <span class="filter-label" data-metal="silver">Серебро</span>
                    <span class="filter-label" data-metal="platinum">Платина</span>
                </div>
                <div class="filter-section">
                    <select id="sort-select" class="sort-select"style="color: white;">
                        <option value="default">Сортировка</option>
                        <option value="price-asc">Цена: по возрастанию</option>
                        <option value="price-desc">Цена: по убыванию</option>
                        <option value="name-asc">Название: А-Я</option>
                        <option value="name-desc">Название: Я-А</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Товары -->
        <div class="products-grid" id="products-list"></div>

        <!-- Корзина -->
        <div class="cart-sidebar" id="cart-sidebar">
            <div class="cart-header">
                <h2>Корзина</h2>
                <button class="close-cart" onclick="toggleCart()">✕</button>
            </div>
            <div id="cart-list">
                <div class="empty-cart">
                    <i class="fas fa-shopping-bag"></i>
                    <p>Корзина пуста</p>
                </div>
            </div>
        </div>
    </main>

    <div class="cart-overlay" id="cart-overlay" onclick="toggleCart()"></div>

    <footer>
        <p>&copy; 2026 JUWELIER. Все права защищены.</p>
    </footer>
</div>

<script>
    // ---------- РАСШИРЕННЫЙ АССОРТИМЕНТ: по 4 кольца, 4 серьги, 4 подвески, 4 браслета ----------
    let products = [
        // КОЛЬЦА (4 шт)
        { id: 1, name: 'Кольцо "Лунный свет"', price: 12500, category: 'ring', metal: 'gold', metalName: 'Золото 585', size: '16, 17, 18, 19', weight: '2.3 г', stone: 'Фианит', image: 'https://i.pinimg.com/1200x/c9/08/bf/c908bf802c5e66218bee04e4815bb601.jpg' },
        { id: 2, name: 'Кольцо "Королевская ночь"', price: 35000, category: 'ring', metal: 'platinum', metalName: 'Платина 950', size: '15-20', weight: '5.7 г', stone: 'Бриллиант 0.5 ct', image: 'https://i.pinimg.com/736x/02/84/ff/0284ff7502bded97d341f1f4c336f6ef.jpg' },
        { id: 3, name: 'Кольцо "Изумрудный рассвет"', price: 27900, category: 'ring', metal: 'gold', metalName: 'Золото 750', size: '17, 18, 19', weight: '3.9 г', stone: 'Изумруд', image: 'https://i.pinimg.com/736x/35/bc/59/35bc591cf2e9a4947f88c67f0386231e.jpg' },
        { id: 4, name: 'Кольцо "Серебряная луна"', price: 8900, category: 'ring', metal: 'silver', metalName: 'Серебро 925', size: '16-18', weight: '2.1 г', stone: 'Лунный камень', image: 'https://i.pinimg.com/736x/86/60/c2/8660c291af6a4355fe32e8c0a9e74bea.jpg' },

        // СЕРЬГИ (4 шт)
        { id: 5, name: 'Серьги "Золотая роса"', price: 18900, category: 'earrings', metal: 'gold', metalName: 'Золото 585', size: 'One size', weight: '3.1 г', stone: 'Бриллианты 0.15 ct', image: 'https://i.pinimg.com/736x/77/92/3e/77923e5757f59998e931c1598b0d4103.jpg' },
        { id: 6, name: 'Серьги "Лунный свет"', price: 12500, category: 'earrings', metal: 'silver', metalName: 'Золото 585', size: 'One size', weight: '2.5 г', stone: 'Лунный камень', image: 'https://i.pinimg.com/1200x/26/46/f5/2646f5cbebcc4668bd872386dca422f3.jpg' },
        { id: 7, name: 'Серьги "Платиновое сияние"', price: 42000, category: 'earrings', metal: 'platinum', metalName: 'Платина 950', size: 'One size', weight: '4.2 г', stone: 'Бриллианты 0.3 ct', image: 'https://i.pinimg.com/736x/25/66/96/256696cf05492bfb914bc896ad118d93.jpg' },
        { id: 8, name: 'Серьги "Розовый кварц"', price: 9900, category: 'earrings', metal: 'silver', metalName: 'Золото 585', size: 'One size', weight: '2.8 г', stone: 'Розовый кварц', image: 'https://i.pinimg.com/736x/d9/75/ef/d975ef14112497eeec634373f278262c.jpg' },

        // ПОДВЕСКИ (4 шт)
        { id: 9, name: 'Подвеска "Розовое облако"', price: 9500, category: 'pendant', metal: 'silver', metalName: 'Золото 585', size: '4x2 см', weight: '1.8 г', stone: 'Розовый кварц', image: 'https://i.pinimg.com/1200x/37/5c/20/375c2040600cd4a30cef1f47a27ae976.jpg' },
        { id: 10, name: 'Подвеска "Золотая капля"', price: 16500, category: 'pendant', metal: 'gold', metalName: 'Золото 585', size: '3x1.5 см', weight: '2.2 г', stone: 'Топаз', image: 'https://i.pinimg.com/736x/ec/e9/3c/ece93ce78218c1c8a6d7ee9212db274f.jpg' },
        { id: 11, name: 'Подвеска "Платиновый бриз"', price: 28900, category: 'pendant', metal: 'platinum', metalName: 'Платина 950', size: '2.5х2 см', weight: '3.4 г', stone: 'Бриллиант', image: 'https://i.pinimg.com/1200x/7e/ab/5e/7eab5e7cca5786128475384709831896.jpg' },
        { id: 12, name: 'Подвеска "Лунный серп"', price: 7400, category: 'pendant', metal: 'silver', metalName: 'Серебро 925', size: '3х1.8 см', weight: '1.5 г', stone: 'Лабрадорит', image: 'https://i.pinimg.com/736x/71/f3/da/71f3da66749b8092318d9b764ed6326a.jpg' },

        // БРАСЛЕТЫ (4 шт)
        { id: 13, name: 'Браслет "Серебряный звон"', price: 7500, category: 'bracelet', metal: 'silver', metalName: 'Серебро 925', size: '17-19 см', weight: '4.2 г', stone: 'фианит', image: 'https://i.pinimg.com/1200x/de/59/79/de597984da318784b8eb04a1286eece8.jpg' },
        { id: 14, name: 'Браслет "Золотая нить"', price: 21900, category: 'bracelet', metal: 'gold', metalName: 'Золото 585', size: '16-18 см', weight: '5.1 г', stone: 'Цитрин', image: 'https://i.pinimg.com/736x/9a/01/e5/9a01e56cb2b62e4ac0b85ee5ae928aa3.jpg' },
        { id: 15, name: 'Браслет "Платиновый блеск"', price: 54900, category: 'bracelet', metal: 'platinum', metalName: 'Платина 950', size: '18-20 см', weight: '7.8 г', stone: 'Бриллианты', image: 'https://i.pinimg.com/1200x/69/fa/b8/69fab82cf9e74e3b94482f3b31fcdf2a.jpg' },
        { id: 16, name: 'Браслет "Облачный жемчуг"', price: 12300, category: 'bracelet', metal: 'silver', metalName: 'Серебро 925', size: '17 см', weight: '3.9 г', stone: 'Жемчуг', image: 'https://i.pinimg.com/1200x/19/c3/60/19c360d2d83f501dcb0f5d9d413fbfac.jpg' }
    ];

    let cart = [];
    let currentCategoryFilter = 'all';
    let currentMetalFilter = 'all';
    let currentSort = 'default';

    function loadProducts() {
        let filteredProducts = [...products];

        if (currentCategoryFilter !== 'all') {
            filteredProducts = filteredProducts.filter(p => p.category === currentCategoryFilter);
        }
        if (currentMetalFilter !== 'all') {
            filteredProducts = filteredProducts.filter(p => p.metal === currentMetalFilter);
        }
        if (currentSort === 'price-asc') {
            filteredProducts.sort((a, b) => a.price - b.price);
        } else if (currentSort === 'price-desc') {
            filteredProducts.sort((a, b) => b.price - a.price);
        } else if (currentSort === 'name-asc') {
            filteredProducts.sort((a, b) => a.name.localeCompare(b.name));
        } else if (currentSort === 'name-desc') {
            filteredProducts.sort((a, b) => b.name.localeCompare(a.name));
        }

        const container = document.getElementById('products-list');
        container.innerHTML = filteredProducts.map(product => `
            <div class="product-card" onclick="toggleDetails(${product.id})">
                <div class="product-image">
                    <img src="${product.image}" alt="${product.name}" onerror="this.src='https://via.placeholder.com/300/C9C59A/white?text=Jewelry'">
                </div>
                <div class="product-info">
                    <div class="product-title">${product.name}</div>
                    <div class="product-price">${product.price.toLocaleString()} ₽</div>
                    <button class="add-to-cart" onclick="event.stopPropagation(); addToCart(${product.id})">
                        В корзину
                    </button>
                </div>
                <div class="product-details" id="details-${product.id}">
                    <div class="detail-row"><span class="detail-label">Металл:</span><span class="detail-value metal-${product.metal}">${product.metalName}</span></div>
                    <div class="detail-row"><span class="detail-label">Размер:</span><span class="detail-value">${product.size}</span></div>
                    <div class="detail-row"><span class="detail-label">Вес:</span><span class="detail-value">${product.weight}</span></div>
                    <div class="detail-row"><span class="detail-label">Камень:</span><span class="detail-value">${product.stone}</span></div>
                </div>
            </div>
        `).join('');
    }

    function toggleDetails(productId) {
        const detailsDiv = document.getElementById(`details-${productId}`);
        if (!detailsDiv) return;
        const cardDiv = detailsDiv.closest('.product-card');
        if (!cardDiv) return;
        if (cardDiv.classList.contains('expanded')) {
            cardDiv.classList.remove('expanded');
        } else {
            document.querySelectorAll('.product-card').forEach(c => c.classList.remove('expanded'));
            cardDiv.classList.add('expanded');
        }
    }

    function addToCart(productId) {
        const product = products.find(p => p.id === productId);
        if (!product) return;
        const existingItem = cart.find(item => item.id === productId);
        if (existingItem) {
            existingItem.quantity++;
        } else {
            cart.push({
                id: productId,
                name: product.name,
                price: product.price,
                metal: product.metalName,
                size: product.size,
                quantity: 1
            });
        }
        updateCartDisplay();
        updateCartCount();
        saveCartToLocalStorage();
        showNotification(`${product.name} добавлено в корзину`);
    }

    function updateCartDisplay() {
        const cartContainer = document.getElementById('cart-list');
        if (cart.length === 0) {
            cartContainer.innerHTML = `<div class="empty-cart"><i class="fas fa-shopping-bag"></i><p>Корзина пуста</p></div>`;
            return;
        }
        const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        const totalQty = cart.reduce((sum, item) => sum + item.quantity, 0);
        cartContainer.innerHTML = `
            ${cart.map(item => `
                <div class="cart-item">
                    <div class="cart-item-details">
                        <div class="cart-item-title">${item.name}</div>
                        <div class="cart-item-price">${item.price.toLocaleString()} ₽</div>
                        <div class="cart-item-meta" style="font-size: 12px; color: #999;">${item.metal}, ${item.size}</div>
                        <div class="cart-item-controls">
                            <button class="quantity-btn" onclick="updateQuantity(${item.id}, ${item.quantity - 1})">-</button>
                            <span>${item.quantity}</span>
                            <button class="quantity-btn" onclick="updateQuantity(${item.id}, ${item.quantity + 1})">+</button>
                            <button class="delete-btn" onclick="removeFromCart(${item.id})">Удалить</button>
                        </div>
                    </div>
                </div>
            `).join('')}
            <div class="cart-total"><span>Итого:</span><span>${total.toLocaleString()} ₽ (${totalQty} шт.)</span></div>
        `;
    }

    function updateQuantity(productId, newQuantity) {
        if (newQuantity <= 0) {
            removeFromCart(productId);
            return;
        }
        const item = cart.find(i => i.id === productId);
        if (item) {
            item.quantity = newQuantity;
            updateCartDisplay();
            updateCartCount();
            saveCartToLocalStorage();
        }
    }

    function removeFromCart(productId) {
        cart = cart.filter(item => item.id !== productId);
        updateCartDisplay();
        updateCartCount();
        saveCartToLocalStorage();
        showNotification('Товар удален');
    }

    function updateCartCount() {
        const totalQty = cart.reduce((sum, item) => sum + item.quantity, 0);
        const cartCount = document.getElementById('cart-count');
        if (cartCount) cartCount.textContent = totalQty;
    }

    function saveCartToLocalStorage() {
        localStorage.setItem('jewelry-cart', JSON.stringify(cart));
    }

    function loadCartFromLocalStorage() {
        const savedCart = localStorage.getItem('jewelry-cart');

        const notification = document.createElement('div');
        notification.className = 'notification';

                loadProducts();

        document.querySelectorAll('[data-metal]').forEach(el => {

        const overlay = document.getElementById('cart-overlay');
        sidebar.classList.toggle('open');

        setupFilters();
        document.querySelector('.cart-icon')?.addEventListener('click', toggleCart);
